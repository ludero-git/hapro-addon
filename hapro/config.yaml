name: "hapro"
description: "Professional manager for multiple HA installations."
slug: "hapro"
version: "v1.5.4"
image: ghcr.io/ludero-git/hapro-addon-{arch}
url: "https://github.com/ludero-git/hapro-addon/tree/main/hapro"
init: false
startup: services
host_network: true
docker_api: true
homeassistant_api: true
hassio_api: true
hassio_role: "manager"
arch:
  - aarch64
  - amd64
map:
  - homeassistant_config:rw
  - backup:rw
  - ssl:rw
  - share:rw
  - media:rw
  - addons:rw
options:
  uuid: ""
  apiUrl: "https://api.ludero.nl"
  caddy_port: 8099
  debug: false
  filespath: "/homeassistant/ludero-package-templates"
schema:
  uuid: "match(^$|^[0-9a-fA-F]{32}$)"
  apiUrl: str
  caddy_port: int?
  debug: bool?
  filespath: str?
